name: douban
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  douban:
    name: Douban mark data sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: movie
        uses: lizheming/doumark-action@master
        with:
          id: 165973978
          type: movie
          format: json
          dir: ./data/douban

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch movie intro
        run: python scripts/fetch_intro.py

      - name: Commit
        uses: EndBug/add-and-commit@v8
        with:
          message: 'chore: update douban data'
          add: './data/douban'
